fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=php_cache:10m max_size=100m inactive=60m use_temp_path=off;

upstream php_fpm {
    server app:9000;
    keepalive 16;  # Giữ lại 16 connection thường trực đến PHP-FPM
}

server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;

    # Tắt access log để giảm I/O
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression để giảm băng thông
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files caching (không qua PHP)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;  # Dùng upstream với keepalive
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";  # Tắt HTTPoxy vulnerability

        # Timeout hợp lý hơn (300s là quá cao)
        fastcgi_read_timeout 60;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout 60;

        # Buffer lớn để tránh ghi đĩa trung gian
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Microcache 1 giây cho GET requests
        # Nhiều user cùng gọi /api/product trong 1s → chỉ PHP xử lý 1 lần
        fastcgi_cache php_cache;
        fastcgi_cache_key "$request_method$host$request_uri";
        fastcgi_cache_valid 200 1s;
        fastcgi_cache_methods GET HEAD;
        fastcgi_no_cache $request_method;       # POST/PUT/DELETE không cache
        fastcgi_cache_bypass $request_method;   # Bypass cache cho non-GET
        add_header X-Cache-Status $upstream_cache_status;  # Debug: HIT/MISS
    }
}