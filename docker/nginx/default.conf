fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=php_cache:10m max_size=200m inactive=60m use_temp_path=off;

# ─── Map: $non_get = "1" nếu method KHÔNG phải GET/HEAD, "" nếu là GET/HEAD ──
# Dùng cho fastcgi_no_cache / fastcgi_cache_bypass
# Lỗi cũ: dùng $request_method trực tiếp → method string không bao giờ empty
#           → cache bị bypass HOÀN TOÀN mọi request
map $request_method $non_get {
    default  1;   # POST, PUT, DELETE, PATCH → không cache
    GET      "";  # empty string = false → được cache
    HEAD     "";
}

upstream php_fpm {
    server app:9000;
    keepalive 32;  # Giữ persistent connections đến PHP-FPM, giảm TCP handshake
}

server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;
    client_max_body_size 64M;

    # Tắt access log để giảm I/O disk
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # ─── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/x-javascript image/svg+xml;
    gzip_min_length 1000;

    # ─── Static files: cache phía browser 30 ngày, không qua PHP ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";  # Chặn HTTPoxy vulnerability

        # Timeouts hợp lý
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;

        # Buffer lớn để tránh ghi tạm ra disk
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
        fastcgi_busy_buffers_size 64k;

        # ── Microcache: 2 giây cho GET requests ───────────────────────────────
        # GET /api/product từ nhiều user trong 2s → PHP chỉ xử lý 1 lần
        # Đã fix: dùng $non_get thay vì $request_method (lỗi logic cũ)
        fastcgi_cache             php_cache;
        fastcgi_cache_key         "$request_method$host$request_uri";
        fastcgi_cache_valid       200 2s;
        fastcgi_cache_valid       404 1s;
        fastcgi_cache_methods     GET HEAD;
        fastcgi_no_cache          $non_get;       # POST/PUT/DELETE → không cache
        fastcgi_cache_bypass      $non_get;       # POST/PUT/DELETE → bypass cache
        fastcgi_cache_use_stale   error timeout updating http_500 http_503;
        fastcgi_cache_lock        on;             # Chỉ 1 request upstream khi cache miss
        add_header X-Cache-Status $upstream_cache_status;  # Debug: HIT/MISS/BYPASS
    }
}