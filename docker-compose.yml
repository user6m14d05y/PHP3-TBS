# version: '3.8'

services:
  # 1. Container Frontend (Vue)
  frontend:
    image: node:20-alpine
    container_name: frontend-tbs
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # Cache node_modules riêng, không reinstall mỗi lần
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  # 2. Container Backend (PHP)
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: backend-tbs
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy  # Chờ MySQL sẵn sàng mới start PHP

  # 3. Container Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: webserver-tbs
    ports:
      - "8888:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # 4. Container Database (MySQL) — có tuning config
  db:
    image: mysql:8.0
    container_name: mysql-tbs
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: flower_db_server
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf  # Tuning config
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:
  frontend_node_modules:  # Named volume cho node_modules — tránh reinstall